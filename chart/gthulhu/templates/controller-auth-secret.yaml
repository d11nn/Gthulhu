{{- if and .Values.controller.enabled (eq .Values.controller.strategyMode "manager") (not .Values.controller.managerAuth.existingSecret) }}
{{- $secretName := include "gthulhu.controllerAuthSecretName" . }}
{{- $tokenKey := .Values.controller.managerAuth.tokenKey }}
{{- $token := randAlphaNum 48 }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing (hasKey $existing.data $tokenKey) }}
{{- $token = (index $existing.data $tokenKey | b64dec) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "gthulhu.labels" . | nindent 4 }}
    app.kubernetes.io/component: scaling-controller
type: Opaque
stringData:
  {{ $tokenKey }}: {{ $token | quote }}
{{- end }}
